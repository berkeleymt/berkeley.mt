# The URL the site will be built for
base_url = "/"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = false

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

taxonomies = [{ name = "tags", render = false }]

[markdown]
smart_punctuation = true
# Whether to do syntax highlighting
# Theme can be customised by setting the `highlight_theme` variable to a theme supported by Zola
highlight_code = false

[extra]
# Absolute origin for link-preview URLs (og:image, og:url)
site_url = "https://berkeley.mt"
# Put all your custom variables here

# Site-wide advisory banner, shown on every page. Comment out or delete the
# whole [extra.advisory] table to remove the banner.
# `status` is one of "info", "warning", or "error"; `body` is markdown.
# `timestamp` is free text shown in the top right; include the timezone.
# Optional [extra.advisory.after] (same fields plus `from`, an ISO timestamp with
# offset) replaces the banner in the browser once `from` has passed.

[extra.advisory]
status = "error"
title = "Flying in to BMT 2026?"
timestamp = "November 13, 2026"
body = """
High winds at SFO have caused an FAA ground stop and long flight delays. We expect
BMT 2026 to start on time tomorrow! If your flight won't get you here in time,
email us at <team@berkeley.mt> and we'll switch your registration to BMT 2026
Online on December 5 and refund the difference. We're so sorry for the
inconvenience! See [your options](/news/bmt-2026-flight-delays/).
"""
