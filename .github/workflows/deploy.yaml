name: Build and Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: "10 8 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Check Nix flake inputs
        uses: DeterminateSystems/flake-checker-action@v10

      - name: Build website for production
        run: nix build .#for-production

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare site files
        run: cp -rL result site && chmod -R u+w site

      - name: Install Playwright Core
        run: npm install --no-save --no-package-lock playwright-core@1.48.2

      - name: Generate At a Glance email images
        run: node scripts/glance-images.mjs site

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: site/

  deploy-ocf:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production
      url: https://berkeley.mt/
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: result

      - name: Deploy to OCF
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avPh --delete --exclude=.htaccess
          path: .
          remote_path: ~/public_html/new
          remote_host: tsunami.ocf.berkeley.edu
          remote_user: bmt
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

  deploy-cf-pages:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Cloudflare Pages
      url: https://berkeley-mt.pages.dev
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: result

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 44d0498f26e72b3e24b3ba9d152ca879
          command: pages deploy . --project-name=berkeley-mt
