name: Build and Deploy Preview

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v11

      - name: Setup Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@v6

      - name: Check Nix flake inputs
        uses: DeterminateSystems/flake-checker-action@v7

      - name: Build website
        run: nix build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare site files
        run: cp -rL result site && chmod -R u+w site

      - name: Install Playwright Core
        run: npm install --no-save --no-package-lock playwright-core@1.48.2

      - name: Generate At a Glance email images
        run: node scripts/glance-images.mjs site

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: site/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Preview
      url: https://pr-${{ github.event.number }}.berkeley-mt.pages.dev
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: result

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 44d0498f26e72b3e24b3ba9d152ca879
          command: pages deploy . --project-name=berkeley-mt --branch=pr-${{ github.event.number }}
